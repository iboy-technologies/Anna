<?xml version="1.0" encoding="utf-8"?>
<!-- assets/tech-pattern.svg - decorative pattern used as an overlay -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" aria-hidden="true" role="img">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0a4d78" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.06" />
  <g opacity="0.08" fill="#0a4d78">
    <circle cx="120" cy="80" r="6">
      <animate attributeName="r" dur="4s" values="5;8;5" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="200" r="5">
      <animate attributeName="r" dur="5s" values="4;7;4" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
